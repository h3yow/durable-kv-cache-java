# ===== 持久化键值缓存配置（cache.* 由 CacheProperties 绑定并在启动恢复前校验）=====

# 持久化数据目录（WAL + snapshot.db）。使用相对路径时相对于进程工作目录。
cache.data-dir=${java.io.tmpdir}/durable-kv-cache-demo

# 容量上限（活动键数量）
cache.max-entries=10000

# 单个值的 UTF-8 字节上限（默认 1 MiB）
cache.max-value-bytes=1048576

# 容量满时的行为：EVICT_LRU（先过期后 LRU 确定性淘汰）或 REJECT（拒绝新键）
cache.eviction=EVICT_LRU

# 每条已确认写入是否 fsync 落盘
cache.fsync-each-write=true

# 活动 WAL 超过该字节后自动触发快照压缩；0 表示关闭自动压缩
cache.wal-compaction-bytes=16777216

# 后台过期清理间隔（毫秒），必须 > 0
cache.cleanup-interval-ms=1000

# 本地演示端口
server.port=8080
