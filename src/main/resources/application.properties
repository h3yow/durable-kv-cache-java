# 键值缓存配置
# WAL 数据目录（本地持久化，不依赖任何外部服务）
kv-cache.data-dir=${KV_CACHE_DATA_DIR:data}
# 最大存活键数量；<=0 表示不限制
kv-cache.max-entries=${KV_CACHE_MAX_ENTRIES:1000}
# 单个 value 最大 UTF-8 字节数
kv-cache.max-value-bytes=${KV_CACHE_MAX_VALUE_BYTES:65536}
# key 最大字符数
kv-cache.max-key-length=${KV_CACHE_MAX_KEY_LENGTH:256}

spring.application.name=durable-kv-cache-java
